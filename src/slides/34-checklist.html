<section class="s-check" data-section="Fechamento" data-menu-title="Checklist da estação">
  <header class="slide-head compact">
    <p class="eyebrow">Na estação de prática</p>
    <h2>Checklist: um examina, o outro acompanha; depois trocam</h2>
  </header>
  <form class="checklist fill" data-component="checklist" onsubmit="return false">
    <fieldset>
      <legend>Preparo, inspeção, ausculta e percussão</legend>
      <label><input type="checkbox">Higieniza as mãos, apresenta-se, explica e pede permissão</label>
      <label><input type="checkbox">Decúbito dorsal, travesseiro baixo, braços ao lado; expõe do xifoide ao púbis com privacidade</label>
      <label><input type="checkbox">Pergunta onde dói e deixa essa região para o fim</label>
      <label><input type="checkbox">Inspeciona de pé e tangencialmente: forma, cicatriz umbilical, pele, movimentos</label>
      <label><input type="checkbox">Ausculta antes de percutir e palpar; prolonga a escuta antes de dizer "ausentes"</label>
      <label><input type="checkbox">Percute os quadrantes e mede a hepatimetria na linha hemiclavicular direita</label>
      <label><input type="checkbox">Percute o espaço de Traube</label>
    </fieldset>
    <fieldset>
      <legend>Palpação e registro</legend>
      <label><input type="checkbox">Mãos aquecidas; palpação superficial começando longe da dor, olhando o rosto</label>
      <label><input type="checkbox">Distingue defesa voluntária de rigidez</label>
      <label><input type="checkbox">Palpação profunda com descrição de eventuais massas</label>
      <label><input type="checkbox">Palpa o fígado começando baixo, com inspiração profunda</label>
      <label><input type="checkbox">Palpa o baço na diagonal, começando baixo</label>
      <label><input type="checkbox">Faz a punho-percussão lombar comparando os lados</label>
      <label><input type="checkbox">Registra achados na ordem do exame, com lugar e medida</label>
    </fieldset>
    <div class="ck-bar"><span class="ck-count"></span><span class="ck-prog" aria-hidden="true"></span><button type="button" class="btn ghost ck-reset">Limpar</button></div>
  </form>
  <aside class="notes">As marcações não são salvas: servem para a dupla acompanhar a execução. (0,5 min)</aside>
</section>
